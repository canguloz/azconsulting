    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Outfit', sans-serif;
            background: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-wrap { text-align: center; padding: 40px 20px; max-width: 500px; }
        .error-code {
            font-size: 8rem;
            font-weight: 800;
            color: #0d1630;
            line-height: 1;
            margin-bottom: 8px;
        }
        .error-code span { color: #FF7A00; }
        .error-title {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: #0d1630;
        }
        .error-desc {
            font-size: 1rem;
            color: #64748b;
            margin-bottom: 32px;
            line-height: 1.6;
        }
        .error-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .error-actions a {
            padding: 12px 28px;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .btn-home { background: #0d1630; color: #fff; }
        .btn-home:hover { background: #FF7A00; color: #fff; }
        .btn-blog { background: transparent; color: #0d1630; border: 2px solid #0d1630; }
        .btn-blog:hover { background: #0d1630; color: #fff; }
        .theme-toggle {
            position: fixed; top: 20px; right: 20px; width: 44px; height: 44px;
            border-radius: 50%; border: 1px solid rgba(13,22,48,0.12); background: #fff;
            color: #0d1630; font-size: 1.1rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s ease;
        }
        .theme-toggle:hover { color: #FF7A00; transform: rotate(20deg); }
        body.dark-mode { background: #0a0f1e; color: #e2e8f0; }
        body.dark-mode .error-code { color: #e8edf7; }
        body.dark-mode .error-title { color: #e2e8f0; }
        body.dark-mode .error-desc { color: #94a3b8; }
        body.dark-mode .btn-home { background: #1a2540; color: #fff; }
        body.dark-mode .btn-home:hover { background: #FF7A00; color: #fff; }
        body.dark-mode .btn-blog { color: #e2e8f0; border-color: rgba(226,232,240,0.4); }
        body.dark-mode .btn-blog:hover { background: #e2e8f0; color: #0d1630; }
        body.dark-mode .theme-toggle { background: #111827; color: #FF7A00; border-color: rgba(255,255,255,0.12); }
    </style>
</head>

<body>
    <!-- Aplica el tema guardado antes de pintar para evitar destello -->
    <script>
        (function () {
            try {
                if (localStorage.getItem('theme') === 'dark') {
                    document.body.classList.add('dark-mode');
                }
            } catch (e) {}
        })();
    </script>
    <button id="darkModeToggle" class="theme-toggle" aria-label="Cambiar modo oscuro/claro">
        <i class="fas fa-moon"></i>
    </button>
    <div class="error-wrap">
        <div class="error-code">4<span>0</span>4</div>
        <h1 class="error-title">Página no encontrada</h1>
        <p class="error-desc">La página que buscas no existe, fue movida o está en mantenimiento. Volvé al inicio o revisá nuestro blog.</p>
        <div class="error-actions">
            <a href="/" class="btn-home"><i class="fas fa-home me-2"></i>Volver al inicio</a>
            <a href="/#blog" class="btn-blog"><i class="fas fa-newspaper me-2"></i>Ir al blog</a>
        </div>
    </div>
    <script>
        (function () {
            var body = document.body;
            var btn = document.getElementById('darkModeToggle');
            function syncIcon() {
                var dark = body.classList.contains('dark-mode');
                btn.innerHTML = dark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
            }
            syncIcon();
            btn.addEventListener('click', function () {
                var dark = body.classList.toggle('dark-mode');
                try {
                    localStorage.setItem('theme', dark ? 'dark' : 'light');
                } catch (e) {}
                syncIcon();
            });
        })();
    </script>
</body>

</html>
